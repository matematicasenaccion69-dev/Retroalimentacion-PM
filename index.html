<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Evaluaciones Interactivas</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 700px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.08);
        }

        h1 {
            color: #1e293b;
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 8px;
        }

        p.subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
            font-size: 1rem;
        }

        .subject-section {
            margin-bottom: 25px;
        }

        .subject-title {
            font-size: 1.2rem;
            color: #2563eb;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 6px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
        }

        .test-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            padding: 14px 18px;
            border-radius: 10px;
            text-decoration: none;
            color: #334155;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .test-card:hover {
            background: #eff6ff;
            border-color: #3b82f6;
            color: #1d4ed8;
            transform: translateY(-2px);
        }

        .badge {
            background: #dbeafe;
            color: #1e40af;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: normal;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Evaluaciones Interactivas</h1>
        <p class="subtitle">Selecciona la materia y la prueba que deseas realizar</p>

        <!-- SECCIÓN: MATEMÁTICAS -->
        <div class="subject-section">
            <h2 class="subject-title">📐 Pensamiento Matemático</h2>
            <div class="test-grid">
                <a href="Pensamiento_Matematico_I/Logica.html" class="test-card">
                    <span>Logica</span>
                    <span class="badge">10 Preguntas</span>
                </a>


               <a href="Pensamiento_Matematico_I/CriterioMCMoMCD.html" class="test-card">
                    <span>Criterios de MCM y MCD</span>
                    <span class="badge">10 Preguntas</span>
                </a>



                <!-- Puedes agregar más tests simplemente copiando esta etiqueta 'a' -->
            </div>
        </div>

        <!-- SECCIÓN: OTRA ASIGNATURA (Ejemplo) -->
        <div class="subject-section">
            <h2 class="subject-title">🔬 Ciencias / Física</h2>
            <div class="test-grid">
                <a href="fisica/movimiento.html" class="test-card">
                    <span>Leyes de Newton</span>
                    <span class="badge">Próximamente</span>
                </a>
            </div>
        </div>

    </div>

</body>
</html>
